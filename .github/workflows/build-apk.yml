name: Diagnosticar abertura do APK 0.41.37

on: workflow_dispatch

permissions:
  actions: read
  contents: read

jobs:
  smoke:
    name: Abrir e retomar no Android API ${{ matrix.api }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 34]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: TCL-xCloud-App-Release-Android10
          run-id: 45868084601
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-apk
      - name: Preparar ADB e KVM
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;34.0.0'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-xcloud-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instalar e abrir o APK sem conta Xbox
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash scripts/smoke_device.sh "$RUNNER_TEMP/signed-apk/app-release.apk" emulator-5554 phone --repeats 3 --report "$RUNNER_TEMP/android-smoke.json" || { adb -s emulator-5554 logcat -b crash -d -t 120; adb -s emulator-5554 shell dumpsys activity activities | grep -E 'ResumedActivity|com\.xcloud\.tclnative' | head -30; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android-smoke-api-${{ matrix.api }}
          overwrite: true
          path: ${{ runner.temp }}/android-smoke.json
          if-no-files-found: error
